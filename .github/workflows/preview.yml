name: preview

# ADR 0003: the preview is built here and uploaded to Pages, never committed.
on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview
        default: '2026-10-28'
        required: true
      marker:
        description: Include the lane marker (off for the clean-up upload)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the digest page as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          NIGHT: ${{ inputs.night }}
          WANT_MARKER: ${{ inputs.marker }}
        run: |
          [[ "$NIGHT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad night"; exit 1; }
          PORT=8787 pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS "localhost:8787/digest/$NIGHT" -o _site/index.html
          kill %1
          if [ "$WANT_MARKER" = "true" ]; then
            grep -qF -- "$LANE_MARKER" _site/index.html || { echo "marker missing"; exit 1; }
          else
            grep -q 'no marker set' _site/index.html || { echo "marker not cleared"; exit 1; }
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
